<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazilio Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 450px;
        }
        h1 { color: #1db954; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
        }
        button, .btn-pdf {
            width: 100%;
            background: #1db954;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        button:hover, .btn-pdf:hover { background: #1aa34a; }
        .btn-pdf { background: #333; border: 1px solid #1db954; }
        .btn-pdf:hover { background: #444; }
        .result { margin-top: 25px; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bazilio Web</h1>
        <form action="/generate" method="POST">
            <label for="song_name">Nombre de la canción:</label>
            <input type="text" id="song_name" name="song_name" value="melodia" required>

            <label for="notes">Notas musicales:</label>
            <!-- Muestra las notas guardadas para que no se borren -->
            <textarea id="notes" name="notes" rows="8" placeholder="Ejemplo:&#10;f4&#10;g4&#10;a4" required>{{ notes if notes else '' }}</textarea>

            <button type="submit">Generar Melodía</button>
        </form>

        <div class="result">
            <h3>Resultado:</h3>
            {% if audio_file %}
                <p>Reproduciendo: {{ audio_file }}</p>
                <audio controls autoplay>
                    <source src="{{ url_for('download_file', filename=audio_file) }}" type="audio/mpeg">
                    Tu navegador no soporta el elemento de audio.
                </audio>
                
                {% if pdf_file %}
                    <a href="{{ url_for('download_file', filename=pdf_file) }}" class="btn-pdf" target="_blank">📄 Descargar Partitura PDF</a>
                {% endif %}
            {% else %}
                <p style="color: #888;">Escribe tus notas y genera tu música.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
